name: Assemble mp4 from b64 chunks
on:
  push:
    paths:
      - 'chunks/**'
      - '.github/workflows/assemble-mp4.yml'
      - 'scripts/assemble.sh'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble all
        run: bash scripts/assemble.sh
      - name: Commit assembled mp4s
        run: |
          set -euo pipefail
          git config user.name "gold-fri-bot"
          git config user.email "dwtrading@post.com"
          git add -- *.mp4
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Assemble creatives from chunks"
            # checkout leaves a detached HEAD; push the branch that triggered the run.
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
